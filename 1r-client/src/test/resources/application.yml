server:
  port: 9090

logging:
  level:
    root: INFO
    "io.ontomesh.onerecord.client": DEBUG
    "org.eclipse.rdf4j.spring.operationlog.log.slf4": DEBUG
    "org.eclipse.rdf4j.spring": DEBUG
    "reactor.netty.http.client": DEBUG

one-record:
  client:
    base-url: http://localhost:8085
  server:
    host: ${SERVER_HOST:localhost}
    internalIriScheme: ontomesh
    port: ${SERVER_PORT:8080}
    scheme: ${PROTOCOL:http}
