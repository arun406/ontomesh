#----------------- SPRINGBOOT Configuration --------------------#
spring:
  banner:
    location: classpath:banner/banner.txt
  profiles:
    active: ${ONERECORD_CLIENT_PROFILES:clients,kafka}
  cloud:
    config:
      label: client
      fail-fast: true
      username: ${CONFIG_USERNAME:config}
      password: ${CONFIG_PASSWORD:server}
  application:
    name: client
  config:
    import: "${CONFIG_SERVER_URL:optional:configserver:http://config:server@localhost:8080}"
    username: ${CONFIG_USERNAME:config}
    password: ${CONFIG_PASSWORD:server}