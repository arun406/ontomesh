app:
  webclients:
    - name: Subscriber1
      clientId: "http://server.ontomesh.io/logistics-objects/24596a9f-f974-41dd-b6e5-2905ca3da20d"
      baseUrl: http://server.ontomesh.io:90
      description: Subscriber 1 one record server
      services:
        - key: notifications
          endpoint:
            method: POST
            path: /notifications
            headers:
              - key: Accept
                value: application/ld+json
            requestBody: "java.lang.String"
            responseBody: "java.lang.Void"

    - name: Subscriber2
      clientId: "http://server.ontomesh.io/logistics-objects/piece-24596a9f-f974-41dd-b6e5-2905ca3da20e"
      baseUrl: http://server.ontomesh.io:70
      description: Subscriber 2 one record server
      services:
        - key: notifications
          endpoint:
            method: POST
            path: /notifications
            headers:
              - key: Accept
                value: application/ld+json
            requestBody: "java.lang.String"
            responseBody: "java.lang.Void"
server:
  port: ${ONERECORD_CLIENT_PORT:9095}

logging:
  level:
    root: INFO
    "io.ontomesh.onerecord.client": DEBUG
    "org.eclipse.rdf4j.spring.operationlog.log.slf4": DEBUG
    "org.eclipse.rdf4j.spring": DEBUG
    "reactor.netty.http.client": DEBUG

spring:
  cloud:
    stream:
      function:
        bindings:
          consumeNotification-in-0: input
      bindings:
        input:
          destination: notifications
          group: notification-group-01
      kafka:
        binder:
          brokers: localhost:29092,localhost:39092,localhost:49092
        #          #          defaultBrokerPort: 9092
        #          #Default empty
        #          configuration:
        #          #Default 10
        #          healthTimeout: 20
        #          #Default
        #          requiredAcks: 1
        #          #Default 1
        #          replicationFactor: 1
        #          #Default is true
        #          autoCreateTopics: true
        bindings:
          input:
            consumer:
              autoCommitOffset: false
              ackEachRecord: false
              startOffset:
              standardHeaders: both
              configuration:
                commit.interval.ms: 1000
                max.poll.records: 10
              #                default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
              #                default.value.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
