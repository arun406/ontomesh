server:
  port: 9090

logging:
  level:
    root: INFO
    "io.ontomesh.onerecord.client": DEBUG
    "org.eclipse.rdf4j.spring.operationlog.log.slf4": DEBUG
    "org.eclipse.rdf4j.spring": DEBUG
    "reactor.netty.http.client": DEBUG

spring:
  cloud:
    stream:
      function:
        bindings:
          notificationConsumer-in-0: input
      bindings:
        input:
          destination: notifications
          group: notification-group-01

