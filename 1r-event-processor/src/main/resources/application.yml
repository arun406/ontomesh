logging:
  level:
    org.eclipse.rdf4j.spring: ERROR
    root: INFO
server:
  port: ${SERVER_PORT:9095}

rdf4j:
  spring:
    pool:
      enabled: true
    repository:
      remote:
        manager-url: http://Aruns-MacBook-Air.local:7200/
        name: ontomesh
        password: admin
        username: admin

spring:
  config:
    import: 'optional:configserver:'

  kafka:
    bootstrap-servers: localhost:9092
    client-id: client-event-processor
    consumer:
      group-id: group-01
  output:
    ansi:
      enabled: ALWAYS
  application:
    name: 1r-event-processor
  cloud:
    stream:
      function:
        bindings:
          eventProcessor-in-0: input
          eventProcessor-out-0: output
      bindings:
        input:
          destination: "logistics-events"
          group: "events-in-group"
          content-type: plain/text
        output:
          destination: "events-out"
          group: "events-out-group"
#          content-type: plain/text