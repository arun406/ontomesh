#----------------- LOGGING Configuration --------------------#
logging:
  level:
    io.ontomesh.events.processor: DEBUG
    org.eclipse.rdf4j.spring: ERROR
    org.eclipse.rdf4j.spring.operationlog.log.slf4: ERROR
    root: INFO

#----------------- SPRINGBOOT Configuration --------------------#
spring:
  banner:
    location: classpath:banner/banner.txt
  profiles:
    active: ${ONERECORD_PROCESSOR_PROFILES:kafka,onerecord,rdf4j}
  cloud:
    config:
      label: processor
      fail-fast: true
      username: ${CONFIG_USERNAME:config}
      password: ${CONFIG_PASSWORD:server}
  application:
    name: processor
  config:
    #    import: "${CONFIG_SERVER_URL:optional:configserver:http://config:server@config-server:8888}"
    import: "${CONFIG_SERVER_URL:optional:configserver:http://config:server@config-server:8080}"
    username: ${CONFIG_USERNAME:config}
    password: ${CONFIG_PASSWORD:server}
