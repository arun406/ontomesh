#----------------- LOGGING Configuration --------------------#
logging:
  level:
    io.ontomesh.onerecord.server: DEBUG
    org.eclipse.rdf4j.spring: ERROR
    org.eclipse.rdf4j.spring.operationlog.log.slf4: ERROR
    root: INFO

#----------------- ONERECORD Configuration --------------------#
onerecord:
  client:
    events-topic: logistics-events
    events-topic-group-id: group-id-01
    id: client-01
  server:
    host: ${SERVER_HOST:server.ontomesh.io}
    internalIriScheme: ontomesh
    port: ${SERVER_PORT:80}
    scheme: ${PROTOCOL:http}
    url: ${SERVER_URL:http://server.ontomesh.io/}
    subscriptions:
      notify-request-status-change: false
      send-logistics-object-body: false
      subscribe-to-logistics-events: false
      include-subscription-event-type:
        - https://onerecord.iata.org/ns/api#LOGISTICS_EVENT_RECEIVED
        - https://onerecord.iata.org/ns/api#LOGISTICS_OBJECT_CREATED
        - https://onerecord.iata.org/ns/api#LOGISTICS_OBJECT_UPDATED

organizations: '[{name=Test Airline, type=airline, identifier=http://localhost:8080/logistics-objects/957e2622-9d31-493b-8b8f-3c805064dbda},
    {name=Test GHA, type=gha, identifier=http://localhost:8080/logistics-objects/957e2622-9d31-493b-8b8f-3c805064dbda},
    {name=Test Forwarder, type=forwarder, identifier=http://localhost:8080/logistics-objects/957e2622-9d31-493b-8b8f-3c805064dbdb}]'



#----------------- RDF4J Configuration --------------------#
rdf4j:
  spring:
    repository:
      remote:
        manager-url: http://Aruns-MacBook-Air.local:7200/
        name: ontomesh
        password: admin
        username: admin
    operationlog:
      enabled: false
      jmx:
        enabled: false
    pool:
      enabled: true
    resultcache:
      enabled: true
    tx:
      enabled: true
    uuidsource:
      predictable:
        enabled: true

#----------------- SPRINGBOOT Configuration --------------------#
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:5000/realms/ontomesh
  #          jwk-set-uri: http://localhost:5000/realms/ontomesh/protocol/openid-connect/certs
  #          audiences: http://server.ontomesh.io

  output:
    ansi:
      enabled: ALWAYS

  kafka:
    bootstrap-servers: localhost:9092
    client-id: client-01
    consumer:
      group-id: group-01

  config:
    import: 'optional:configserver:'

server:
  port: ${SERVER_PORT:80}
