logging:
  level:
    io.ontomesh.onerecord.server: DEBUG
    org.eclipse.rdf4j.spring: ERROR
    org.eclipse.rdf4j.spring.operationlog.log.slf4: ERROR
    root: INFO
onerecord:
  client:
    events-topic: logistics-events
    events-topic-group-id: group-id-01
    id: 'null'
  server:
    host: ${SERVER_HOST:1r.ontomesh.io}
    internalIriScheme: ontomesh
    port: ${SERVER_PORT:8085}
    scheme: ${PROTOCOL:http}
    url: ${SERVER_URL:http://1r.ontomesh.io/}
    subscriptions:
      include-subscription-event-type: https://onerecord.iata.org/ns/api#LOGISTICS_EVENT_RECEIVED, https://onerecord.iata.org/ns/api#LOGISTICS_OBJECT_CREATED, https://onerecord.iata.org/ns/api#LOGISTICS_OBJECT_UPDATED
      notify-request-status-change: false
      send-logistics-object-body: false
      subscribe-to-logistics-events: false
org:
  eclipse:
    rdf4j:
      repository:
        debug: true
organizations: '[{name=Test Airline, type=airline, identifier=http://localhost:8080/logistics-objects/957e2622-9d31-493b-8b8f-3c805064dbda},
    {name=Test GHA, type=gha, identifier=http://localhost:8080/logistics-objects/957e2622-9d31-493b-8b8f-3c805064dbda},
    {name=Test Forwarder, type=forwarder, identifier=http://localhost:8080/logistics-objects/957e2622-9d31-493b-8b8f-3c805064dbdb}]'
rdf4j:
  spring:
    operationlog:
      enabled: true
      jmx:
        enabled: true
    pool:
      enabled: true
    repository:
      remote:
        manager-url: http://Aruns-MacBook-Air.local:7200/
        name: ontomesh
        password: admin
        username: admin
    resultcache:
      enabled: true
    tx:
      enabled: true
    uuidsource:
      predictable:
        enabled: true
server:
  port: ${SERVER_PORT:8085}

spring:
  kafka:
    bootstrap-servers: localhost:9092
    client-id: client-01
    consumer:
      group-id: group-01

  config:
    import: 'optional:configserver:'
