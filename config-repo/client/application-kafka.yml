#===============================================================================
# KAFKA CONFIGURATION FOR ONE RECORD CLIENT
#===============================================================================
# This configuration defines Kafka settings for the 1r-client service.
# The client consumes notification events from Kafka topics and processes them.

#----------------- SPRING KAFKA CONFIGURATION -----------------#
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:notification-client-group}
      auto-offset-reset: ${KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
      enable-auto-commit: false
      auto-commit-interval: ${KAFKA_CONSUMER_AUTO_COMMIT_INTERVAL:1000}
      session-timeout: ${KAFKA_CONSUMER_SESSION_TIMEOUT:30000}
      heartbeat-interval: ${KAFKA_CONSUMER_HEARTBEAT_INTERVAL:3000}
      max-poll-interval: ${KAFKA_CONSUMER_MAX_POLL_INTERVAL:300000}
      max-poll-records: ${KAFKA_CONSUMER_MAX_POLL_RECORDS:500}
      fetch-min-bytes: ${KAFKA_CONSUMER_FETCH_MIN_BYTES:1}
      fetch-max-wait: ${KAFKA_CONSUMER_FETCH_MAX_WAIT:500}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

#----------------- APPLICATION KAFKA TOPIC CONFIGURATION -----------------
    topic: ${KAFKA_TOPIC_NOTIFICATION:notifications}
