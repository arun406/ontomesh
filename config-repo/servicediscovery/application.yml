server:
  port: ${SERVICE_DISCOVERY_SERVER_PORT:8080}
  forward-headers-strategy: FRAMEWORK

spring:
  resources:
    add-mappings: true
  cloud:
    config:
      fail-fast: false
  security:
    user:
      name: ${EUREKA_USERNAME:eureka}
      password: ${EUREKA_PASSWORD:server}

#service discovery server  configuration
eureka:
  dashboard:
    path: eurekawebui
  instance:
    hostname: ${SERVICE_DISCOVERY_HOST:service-discovery}
    preferIpAddress: false
  client:
    registerWithEureka: false
    fetchRegistry: false
    serviceUrl:
      defaultZone: http://${EUREKA_USERNAME:eureka}:${EUREKA_PASSWORD:server}@${SERVICE_DISCOVERY_HOST:service-discovery}:${SERVICE_DISCOVERY_SERVER_PORT:8080}/eureka/
  server:
    waitTimeInMsWhenSyncEmpty: 0
    enableSelfPreservation: false
    evictionIntervalTimerInMs: 1000