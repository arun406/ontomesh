server:
  port: ${ONERECORD_SERVER_PORT:8080}

spring:
  application:
    name: server
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ISSUER_URI:http://keycloak.keycloak.svc.cluster.local:8080/realms/ontomesh}
#          jwk-set-uri: ${JWK_SET_URI:https://keycloak.ontomesh.io:8443/realms/ontomesh/protocol/openid-connect/certs}
##service discovery client  configuration
#eureka:
#  client:
#    serviceUrl:
#      defaultZone: ${SERVICE_DISCOVERY_URL:http://eureka:server@localhost:8761/eureka}
#management configuration
management:
  #  endpoint:
  #    gateway:
  #      enabled: true
  endpoints:
    web:
      exposure:
        include: "httpexchanges,loggers,health,info,metrics,gateway"

# logging
logging:
  level:
    reactor.netty: INFO
    org.springframework.cloud.gateway: INFO
    io.ontomesh.onerecord.server: DEBUG
    io.ontomesh.onerecord.server.event: DEBUG
    io.ontomesh.onerecord.server.services.logisticsobjects.events: DEBUG
    org.apache.kafka: INFO
    org.springframework.kafka: INFO

server.ssl.trust-store: "classpath:1r-server-truststore.jks"
server.ssl.trust-store-password: changeit
server.ssl.key-store-type: PKCS12
server.ssl.enabled: false