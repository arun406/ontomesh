spring.application.name=mail-adapter
#mail properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=<login user to smtp server>
spring.mail.password=<login password to smtp server>
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
server.port=9000
#Logging
logging.level."io.ontomesh.mail"=debug
#stream
#spring.cloud.stream.bindings.process-in-0.destination=mail_topic
spring.cloud.stream.function.bindings.process-in-0=input
spring.cloud.stream.bindings.input.destination=mail_topic
spring.cloud.stream.output-bindings=message-out-0
spring.cloud.stream.bindings."message-out-0".destination=mail_topic
#Kafka Binder Properties
spring.cloud.stream.kafka.binder.brokers=localhost
spring.cloud.stream.kafka.binder.defaultBrokerPort=9092
spring.cloud.stream.kafka.binder.autoCreateTopics=false