apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-client
  labels:
    app: kafka-client
spec:
  replicas: {{ .Values.kafkaClient.replicas }}
  selector:
    matchLabels:
      app: kafka-client
  template:
    metadata:
      labels:
        app: kafka-client
    spec:
      initContainers:
        - name: download-msk-iam-auth
          image: curlimages/curl:8.6.0
          command:
            - sh
            - -c
            - |
              echo "📥 Downloading AWS MSK IAM Auth plugin..."
              mkdir -p /opt/kafka/libs && \
              curl -L -o /opt/kafka/libs/aws-msk-iam-auth.jar \
              https://github.com/aws/aws-msk-iam-auth/releases/download/v{{ .Values.kafkaClient.awsMskIamAuthVersion }}/aws-msk-iam-auth-{{ .Values.kafkaClient.awsMskIamAuthVersion }}-all.jar && \
              ls -lh /opt/kafka/libs
          volumeMounts:
            - name: kafka-libs
              mountPath: /opt/kafka/libs
      serviceAccountName: {{ .Values.kafkaClient.serviceAccount }}
      containers:
        - name: kafka-client
          image: {{ .Values.kafkaClient.image }}
          command:
            - /bin/bash
            - -c
          args:
            - |
              echo "Installing dependencies..."
              apt-get update -qq && apt-get install -y -qq netcat unzip python3-pip;
              pip install awscli --break-system-packages;
              echo "Ready to run Kafka CLI commands"
              sleep infinity;
          env:
            - name: CLASSPATH
              value: "/opt/kafka/libs/aws-msk-iam-auth.jar:/opt/bitnami/kafka/libs/*"
            - name: KAFKA_OPTS
              value: "-cp /opt/kafka/libs/aws-msk-iam-auth.jar:/opt/bitnami/kafka/libs/*"
          volumeMounts:
            - name: kafka-config
              mountPath: /opt/kafka/config
            - name: kafka-libs
              mountPath: /opt/kafka/libs
      volumes:
        - name: kafka-config
          configMap:
            name: kafka-client-config
        - name: kafka-libs
          emptyDir: {}
