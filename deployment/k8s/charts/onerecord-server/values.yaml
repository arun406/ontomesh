# OneRecord Config
# NOTE: update the placeholders below with actual values from your infra (for example,
# use Terraform outputs such as `msk_bootstrap_brokers_tls`, `eks_cluster_endpoint`, or
# pass values at install time: `helm install --set onerecordConfig.kafkaBootstrapServers="$(terraform output -raw msk_bootstrap_brokers_tls)" ...`).
onerecordConfig:
  profiles: "management,kafka,airline-onerecord,rdf4j"
  kafkaTopicProcessor: "1r-processor"
  iriScheme: "ontomesh"
  serverUrl: "https://airline.ontomesh.com"
  serverPort: "8080"
  # Replace the value below with your MSK bootstrap brokers (TLS), e.g.:
  # "b-1.foo.amazonaws.com:9098,b-2.foo.amazonaws.com:9098,b-3.foo.amazonaws.com:9098"
  # You can populate this from Terraform using `terraform output -raw msk_bootstrap_brokers_tls`.
  kafkaBootstrapServers: "<MSK_BOOTSTRAP_BROKERS_TLS>"
  kafkaClientId: "onerecord-server-kafka-client"
  kafkaGroupId: "onerecord-server-group"
  # GraphDB repository HTTP URL (update if graphdb is installed in a different namespace)
  repositoryUrl: "http://graphdb.graphdb.svc.cluster.local:7200"
  repositoryName: "ontomesh"
  # Keycloak issuer URI - use internal Kubernetes service for pod connectivity
  # External clients (browsers) will use https://keycloak.ontomesh.com
  issuerUri: "http://keycloak.keycloak.svc.cluster.local:8080/realms/ontomesh"

onerecordServer:
  replicas: 1
  serviceAccount: ontomesh-kafka-client-sa
  image: arun406/1r-server:latest
  imagePullPolicy: Always
  javaOpts: ""
  resources:
    requests:
      memory: "512Mi"
    limits:
      memory: "1Gi"

# Repository Secret of base64 
repositoryCredentials:
  username: "b250b21lc2g="
  password: "b250b21lc2g="

# Service
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

# Kafka Client
kafkaClient:
  image: "bitnamilegacy/kafka:3.8.0"
  replicas: 1
  serviceAccount: "ontomesh-kafka-client-sa"
  awsMskIamAuthVersion: "2.3.4"

