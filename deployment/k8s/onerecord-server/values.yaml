# OneRecord Config
onerecordConfig:
  profiles: "management,kafka,airline-onerecord,rdf4j"
  kafkaTopicProcessor: "1r-processor"
  iriScheme: "ontomesh"
  serverUrl: "http://airline.onerecord.com"
  serverPort: "8080"
  kafkaBootstrapServers: "b-1.ontomesh.3xr24v.c2.kafka.ap-south-2.amazonaws.com:9098,b-2.ontomesh.3xr24v.c2.kafka.ap-south-2.amazonaws.com:9098,b-3.ontomesh.3xr24v.c2.kafka.ap-south-2.amazonaws.com:9098"
  kafkaClientId: "onerecord-server-kafka-client"
  kafkaGroupId: "onerecord-server-group"
  repositoryUrl: "http://graphdb.graphdb.svc.cluster.local:7200"
  repositoryName: "ontomesh"
  issuerUri: "http://keycloak.keycloak.svc.cluster.local:8080/realms/ontomesh"

onerecordServer:
  replicas: 1
  serviceAccount: ontonesh-kafka-client-sa
  image: arun406/1r-server:latest
  imagePullPolicy: Always
  resources:
    requests:
      memory: "512Mi"
    limits:
      memory: "1Gi"

# Repository Secret
repositoryCredentials:
  username: "b250b21lc2g=" 
  password: "b250b21lc2g="

# Service
service:
  type: LoadBalancer
  port: 8080
  targetPort: 8080

# Kafka Client
kafkaClient:
  image: "bitnamilegacy/kafka:3.8.0"
  replicas: 1
  serviceAccount: "ontonesh-kafka-client-sa"
  awsMskIamAuthVersion: "2.3.4"

