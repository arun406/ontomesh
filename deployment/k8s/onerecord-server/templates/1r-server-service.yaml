apiVersion: v1
kind: Service
metadata:
  name: onerecord-server-service
  labels:
    app: 1r-server
spec:
  type: {{ .Values.service.type }}
  selector:
    app: 1r-server
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
