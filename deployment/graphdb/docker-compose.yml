services:
  graphdb-node-1:
    image: ontotext/graphdb:10.8.0
    container_name: graphdb-node-1
    ports:
      - "7200:7200"
      - "7300:7300"
    environment:
      - GRAPHDB_AUTH_TOKEN_SECRET=superSecretToken
    command: [ "/opt/graphdb/dist/bin/graphdb", "-Dgraphdb.auth.token.secret=superSecretToken" ]
    volumes:
      - graphdb_data_1:/opt/graphdb/home
    networks:
      - graphdb-cluster
    restart: always
    healthcheck:
      test: "curl -f http://localhost:7200/rest/repositories || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10

  graph-db-setup:
    image: ontotext/graphdb:10.8.0
    entrypoint: [ "/bin/bash", "-c" ]
    restart: "no"
    depends_on:
      graph-db:
        condition: service_healthy
    command:
      - /opt/ontomesh/graphdb/init.sh
    environment:
      - ONTOMESH_REPO_ID=ontomesh
    volumes:
      - "./graphdb/init.sh:/opt/neone/graphdb/init.sh"
      - "./graphdb/neone-repository.ttl:/opt/neone/graphdb/neone-repository.ttl"

networks:
  graphdb-cluster:
    driver: bridge

volumes:
  graphdb_data_1:
    driver: local
#  graphdb_data_2:
#    driver: local

