version: '3.8'

services:

  # GraphDB Node 1
  graphdb-node-1:
    image: ontotext/graphdb:10.8.2
    container_name: graphdb-node-1
    ports:
      - "7200:7200"   # HTTP endpoint for this node
      - "7300:7300"   # SPARQL endpoint for this node
    volumes:
      - ./graphdb.properties:/opt/graphdb/dist/conf/graphdb.properties
      - graphdb_data_node_1:/opt/graphdb/data
    restart: always

volumes:
  graphdb_data_node_1:
