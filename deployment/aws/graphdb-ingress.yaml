apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: graphdb-ingress
  namespace: graphdb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/group.name: ontomesh
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/scheme: internet-facing
spec:
  rules:
  - host: graphdb.ontomesh.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: graphdb
            port:
              number: 7200
