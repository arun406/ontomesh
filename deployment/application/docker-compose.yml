services:
  config-server:
    build:
      context: ../../ontomesh-configserver
      dockerfile: Dockerfile
    container_name: config-server
    environment:
      - CONFIG_SERVER_PORT=${CONFIG_SERVER_PORT}
      - CONFIG_USERNAME=${CONFIG_USERNAME}
      - CONFIG_PASSWORD=${CONFIG_PASSWORD}
      - SEARCH_LOCATIONS=${SEARCH_LOCATIONS}
      - DISCOVERY_CLIENT_ENABLED=${DISCOVERY_CLIENT_ENABLED}
#      - CONFIG_SERVER_URL=http://config-server:8080
    volumes:
      #      - ./../opentelemetry-javaagent-2.6.0.jar:/app/opentelemetry-javaagent.jar
      - ./../../config-repo:/app/config-repo
    #      - ./collector/logs/accesslog/config-server/:/app/docker/collector/logs/accesslog/config-server/
    ports:
      - "8888:8080"
    expose:
      - 8888
    #    depends_on:
    #      - otel-collector
    networks:
      - ontomesh-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  service-discovery:
    build:
      context: ../../ontomesh-servicediscovery
      dockerfile: Dockerfile
    container_name: service-discovery
    environment:
      - CONFIG_SERVER_URL=${CONFIG_SERVER_URL}
      - SERVICE_DISCOVERY_PROFILE=${SERVICE_DISCOVERY_PROFILE}
      - EUREKA_USERNAME=${EUREKA_USERNAME}
      - EUREKA_PASSWORD=${EUREKA_PASSWORD}
      - SERVICE_DISCOVERY_HOST=${SERVICE_DISCOVERY_HOST}
      - SERVICE_DISCOVERY_SERVER_PORT=${SERVICE_DISCOVERY_SERVER_PORT}
    #    volumes:
    #      - ./../opentelemetry-javaagent-2.6.0.jar:/app/opentelemetry-javaagent.jar
    #      - ./collector/logs/accesslog/service-discovery/:/app/docker/collector/logs/accesslog/servicediscovery/
    ports:
      - "8761:8080"
    expose:
      - 8761
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - ontomesh-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "-u", "eureka:server", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: always

  1r-client:
    build:
      context: ./../../1r-client
      dockerfile: Dockerfile
    container_name: 1r-client
    #    image: 1r-client:latest
    ports:
      - "8081:8080"
    environment:
      - ONERECORD_CLIENT_PROFILES=${ONERECORD_CLIENT_PROFILES}
      - ONERECORD_CLIENT_PORT=${ONERECORD_CLIENT_PORT}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_TOPIC_CLIENT=${KAFKA_TOPIC_CLIENT}
      - CONFIG_SERVER_URL=${CONFIG_SERVER_URL}
      - CONFIG_USERNAME=${CONFIG_USERNAME}
      - CONFIG_PASSWORD=${CONFIG_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "keycloak.ontomesh.io:host-gateway"
      - "graphdb.ontomesh.io:host-gateway"
    volumes:
      - ./certs/tls.crt:/usr/local/share/ca-certificates/keycloak.crt:ro
    networks:
      - ontomesh-network
    depends_on:
      config-server:
        condition: service_healthy
      graph-db-setup:
        condition: service_started
      1r-server:
        condition: service_started

  1r-processor:
    build:
      context: ./../../1r-event-processor
      dockerfile: Dockerfile
    container_name: 1r-processor
    #    image: 1r-processor:latest
    ports:
      - "8083:8080"
    environment:
      - ONERECORD_PROCESSOR_PORT=${ONERECORD_PROCESSOR_PORT}
      - ONERECORD_PROCESSOR_PROFILES=${ONERECORD_PROCESSOR_PROFILES}
      - REPOSITORY_URL=${REPOSITORY_URL}
      - REPOSITORY_NAME=${REPOSITORY_NAME}
      - REPOSITORY_USERNAME=${REPOSITORY_USERNAME}
      - REPOSITORY_PASSWORD=${REPOSITORY_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_CLIENT_ID=${KAFKA_CLIENT_ID}
      - KAFKA_GROUP_ID=${KAFKA_GROUP_ID}
      - KAFKA_TOPIC_PROCESSOR=${KAFKA_TOPIC_PROCESSOR}
      - LOGISTICS_EVENTS_NOTIFICATION_TOPIC=${LOGISTICS_EVENTS_NOTIFICATION_TOPIC}
      - SERVICE_DISCOVERY_URL=${SERVICE_DISCOVERY_URL}
      - CONFIG_SERVER_URL=${CONFIG_SERVER_URL}
      - CONFIG_USERNAME=${CONFIG_USERNAME}
      - CONFIG_PASSWORD=${CONFIG_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "keycloak.ontomesh.io:host-gateway"
      - "graphdb.ontomesh.io:host-gateway"
    volumes:
      - ./certs/tls.crt:/usr/local/share/ca-certificates/keycloak.crt:ro
    networks:
      - ontomesh-network
    depends_on:
      config-server:
        condition: service_healthy
      graph-db-setup:
        condition: service_started
      1r-server:
        condition: service_started
      1r-client:
        condition: service_started

  1r-server:
    build:
      context: ./../../1r-server
      dockerfile: Dockerfile
    container_name: 1r-server
    #    image: 1r-server:latest
    ports:
      - "8085:8080"
    environment:
      - ONERECORD_SERVER_PORT=${ONERECORD_SERVER_PORT}
      - ONERECORD_SERVER_PROFILES=${ONERECORD_SERVER_PROFILES}
      - ONERECORD_SERVER_URL=${ONERECORD_SERVER_URL}
      - LOGISTICS_EVENTS_TOPIC=${LOGISTICS_EVENTS_TOPIC}
      - LOGISTICS_SERVER_ID=${LOGISTICS_SERVER_ID}
      - IRI_SCHEME=${IRI_SCHEME}
      - REPOSITORY_URL=${REPOSITORY_URL}
      - REPOSITORY_NAME=${REPOSITORY_NAME}
      - REPOSITORY_USERNAME=${REPOSITORY_USERNAME}
      - REPOSITORY_PASSWORD=${REPOSITORY_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_CLIENT_ID=${KAFKA_CLIENT_ID}
      - KAFKA_GROUP_ID=${KAFKA_GROUP_ID}
      - KAFKA_TOPIC_SERVER=${KAFKA_TOPIC_SERVER}
      - ISSUER_URI=${ISSUER_URI}
      - SERVICE_DISCOVERY_URL=${SERVICE_DISCOVERY_URL}
      - CONFIG_SERVER_URL=${CONFIG_SERVER_URL}
      - CONFIG_USERNAME=${CONFIG_USERNAME}
      - CONFIG_PASSWORD=${CONFIG_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "keycloak.ontomesh.io:host-gateway"
      - "graphdb.ontomesh.io:host-gateway"
    volumes:
      - ./certs/tls.crt:/usr/local/share/ca-certificates/keycloak.crt:ro
    networks:
      - ontomesh-network
    depends_on:
      config-server:
        condition: service_healthy
      graph-db-setup:
        condition: service_started

  postgres:
    image: postgres:latest
    container_name: keycloak_postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ontomesh-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  keycloak:
    image: keycloak/keycloak:latest
    container_name: keycloak_server
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: keycloak.ontomesh.io
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTPS_CERTIFICATE_FILE: /etc/x509/https/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /etc/x509/https/tls.key
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "8443:8443"
    volumes:
      - ./certs:/etc/x509/https:ro
      - ./import:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy
    command: [ "start", "--import-realm" ]
    restart: unless-stopped
    networks:
      - ontomesh-network
    # healthcheck:
    #   test: ["CMD-SHELL", "pgrep -f keycloak || exit 1"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5
    #   start_period: 60s

  graphdb:
    image: ontotext/graphdb:10.8.0
    container_name: graphdb
    ports:
      - "7200:7200"
    environment:
      - GRAPHDB_AUTH_TOKEN_SECRET=superSecretToken
      - GRAPHDB_HEAP_SIZE=2G
      - GRAPHDB_MAX_MEMORY=2G
    command: [ "/opt/graphdb/dist/bin/graphdb", "-Dgraphdb.auth.token.secret=superSecretToken" ]
    volumes:
      - graphdb_data:/opt/graphdb/home
    networks:
      - ontomesh-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7200/rest/repositories"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  graph-db-setup:
    image: ontotext/graphdb:10.8.0
    entrypoint: [ "/bin/bash", "-c" ]
    restart: "no"
    depends_on:
      graphdb:
        condition: service_healthy
    command:
      - |
        # Install curl if not available
        if ! command -v curl &> /dev/null; then
          apt-get update && apt-get install -y curl
        fi
        # Wait a bit more for GraphDB to be fully ready
        sleep 10
        /opt/ontomesh/graphdb/init-repo.sh
    environment:
      - ONTOMESH_REPO_ID=${REPOSITORY_NAME}
    volumes:
      - "./graphdb/init-repo.sh:/opt/ontomesh/graphdb/init-repo.sh"
      - "./graphdb/repo-ontomesh.ttl:/opt/ontomesh/graphdb/repo-ontomesh.ttl"
      - "./graphdb/IATA-1R-DM-Ontology.ttl:/opt/ontomesh/graphdb/IATA-1R-DM-Ontology.ttl"
    networks:
      - ontomesh-network
volumes:
  postgres_data:
    driver: local
  graphdb_data:
    driver: local
networks:
  ontomesh-network:
    driver: bridge
