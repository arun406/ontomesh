version: '3.9'

services:
  postgres:
    image: postgres:latest
    container_name: keycloak_postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  keycloak:
    image: keycloak/keycloak:latest
    container_name: keycloak_server
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: keycloak.ontomesh.io
      #KC_PROXY: edge
      KC_HTTP_ENABLED: "false"
      #KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME: admin
      #KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTPS_CERTIFICATE_FILE: /etc/x509/https/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /etc/x509/https/tls.key
    ports:
      - "8443:8443"
    volumes:
      - ./certs:/etc/x509/https:ro
      - ./import:/opt/keycloak/data/import
    depends_on:
      - postgres
    #    command: >
    #      start
    command: [ "start", "--import-realm" ]
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

# Instructions to generate self-signed certificates:
# 1. Create a directory for the certificates:
#    mkdir -p certs
# 2. Generate the self-signed certificate using OpenSSL:
#    openssl req -x509 -newkey rsa:4096 -sha256 -days 365 -nodes \
#      -keyout certs/tls.key -out certs/tls.crt \
#      -subj "/CN=keycloak.ontomesh.io"
# 3. Adjust permissions for security:
#    chmod 400 certs/tls.key
# Ensure the `certs` directory is in the same location as this file.
