replicaCount: 1

image:
  repository: ontotext/graphdb
  tag: 11.1.2
  pullPolicy: IfNotPresent

resources:
  limits:
    memory: "2Gi"
  requests:
    cpu: "500m"
    memory: "2Gi"

persistence:
  enabled: true
  size: 5Gi
  storageClass: gp2

service:
  type: ClusterIP
  port: 7200

# Disable default ingress - we manage our own via deploy-applications.sh
ingress:
  enabled: false

env:
  GRAPHDB_HTTP_PORT: 7200
  GRAPHDB_RPC_PORT: 7300
  OVERRIDE_USERS: "false"
