server:
  port: ${CONFIG_SERVER_PORT:8080}

spring:
  output:
    ansi:
      enabled: ALWAYS
  banner:
    location: classpath:banner/banner.txt
  application:
    name: configserver
  cloud:
    discovery:
      enabled: ${DISCOVERY_CLIENT_ENABLED:true}
    config:
      server:
        native:
          #          searchLocations: classpath:config-repo/
          searchLocations: ${SEARCH_LOCATIONS:file:///Users/arun/source/ontomesh/config-repo}
          search-paths: '{application}'
  profiles:
    active: native
  security:
    user:
      name: ${CONFIG_USERNAME:config}
      password: ${CONFIG_PASSWORD:server}
eureka:
  client:
    serviceUrl:
      defaultZone: ${SERVICE_DISCOVERY_URL:http://eureka:server@service-discovery:8080/eureka}
#      defaultZone: http://eureka:server@service-discovery:8761/eureka/